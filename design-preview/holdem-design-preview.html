<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holdem · 디자인 비교</title>
  <style>:root {
  --felt: #2c7a4b;
  --felt-dark: #1f5836;
  --gold: #e8c468;
  --chip: #f4d35e;
  --ink: #1a1a1a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #14241b;
  color: #f0f0f0;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;   /* dvh tracks the real viewport when the mobile address bar shows/hides */
}

/* Shown only on narrow (phone) screens; see the mobile media query at the bottom. */
.mobile-only { display: none; }

.hidden { display: none !important; }

/* ---- Join screen ---- */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #234c36, #0e1c14);
  z-index: 10;
}
.join-box {
  background: #1c3326;
  border: 1px solid var(--gold);
  border-radius: 16px;
  padding: 32px 36px;
  width: 340px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.join-box h1 { margin: 0 0 4px; text-align: center; color: var(--gold); }
.subtitle { margin: 0 0 20px; text-align: center; color: #9fbfa9; font-size: 14px; }
.join-box label { display: block; margin-bottom: 14px; font-size: 13px; color: #c8dcd0; }
.join-box input {
  width: 100%;
  margin-top: 4px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #3c5c48;
  background: #122318;
  color: #fff;
  font-size: 15px;
}
.join-box button, #deal-btn {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--gold);
  color: #1a1a1a;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}
.join-box button:hover, #deal-btn:hover { filter: brightness(1.08); }
.trainer-entry { display: block; width: 100%; margin-top: 12px; padding: 11px 8px; text-align: center; border: 1px solid var(--gold); border-radius: 8px; color: var(--gold); text-decoration: none; font-size: 14px; font-weight: 700; }
.trainer-entry:hover { background: #244232; }
a.small.trainer-link { padding: 4px 12px; border-radius: 6px; border: 1px solid #3c5c48; color: var(--gold); text-decoration: none; font-size: 12px; white-space: nowrap; }
a.small.trainer-link:hover { background: #244232; }
.hint, .waiting-hint { font-size: 12px; color: #88a596; margin-top: 14px; }

/* ---- Top bar ---- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: #0e1c14;
  border-bottom: 1px solid #2c4a38;
  font-size: 14px;
}
#phase-label { color: var(--gold); font-weight: 600; text-transform: capitalize; }
button.small {
  padding: 4px 12px; border-radius: 6px; border: 1px solid #3c5c48;
  background: transparent; color: #ccc; cursor: pointer; font-size: 12px;
}

/* ---- Table ---- */
.table-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(100vh - 180px);
  height: calc(100dvh - 180px);
}
.table {
  position: relative;
  width: 980px;
  height: 560px;
  background: radial-gradient(ellipse at center, var(--felt), var(--felt-dark));
  border: 16px solid #5a3a22;
  border-radius: 280px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 14px 40px rgba(0,0,0,0.5);
}
.board {
  position: absolute;
  top: 46%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 3;             /* keep pot/timer above the seats' cards */
}
.community { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 108px; }
.board-row { display: flex; gap: 7px; justify-content: center; align-items: center; }
.board-row.multi { gap: 5px; }
.board-tag {
  width: 18px; height: 18px; flex: none;
  background: var(--gold); color: #1a1a1a; border-radius: 50%;
  font-size: 11px; font-weight: 800; line-height: 18px; text-align: center;
  margin-right: 2px;
}
.pot {
  margin-top: 10px;
  font-size: 24px;
  color: var(--gold);
  font-weight: 800;
}
.status { margin-top: 4px; font-size: 13px; color: #d8e8de; min-height: 18px; }
.turn-timer { margin-top: 2px; font-size: 14px; font-weight: 700; color: #ffe9a8; min-height: 18px; }
.turn-timer.urgent { color: #ff6a6a; }
.turn-bar {
  width: 160px; height: 7px; margin: 4px auto 0;
  background: rgba(0, 0, 0, 0.35); border-radius: 4px; overflow: hidden;
}
.turn-bar-fill {
  height: 100%; width: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #7CFC00, #b6f56b);
  transition: width 0.25s linear;
}
.turn-bar-fill.urgent { background: linear-gradient(90deg, #ff5a5a, #ff8a6a); }

/* ---- Cards ---- */
.card {
  position: relative;
  width: 92px; height: 128px;
  border-radius: 9px;
  background: #fdfdfd;
  color: var(--ink);
  font-weight: 800;
  box-shadow: 0 2px 7px rgba(0,0,0,0.45);
  overflow: hidden;
}
.card.small { width: 68px; height: 95px; border-radius: 7px; }
/* Rank + suit hug the corners (top-left and bottom-right, mirrored). */
.card .corner-top, .card .corner-bottom {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 0.95;
}
.card .corner-top { top: 5px; left: 6px; }
.card .corner-bottom { bottom: 5px; right: 6px; transform: rotate(180deg); }
.card .corner-top .r, .card .corner-bottom .r { font-size: 28px; }
.card .corner-top .s, .card .corner-bottom .s { font-size: 20px; }
.card.small .corner-top { top: 3px; left: 5px; }
.card.small .corner-bottom { bottom: 3px; right: 5px; }
.card.small .corner-top .r, .card.small .corner-bottom .r { font-size: 21px; }
.card.small .corner-top .s, .card.small .corner-bottom .s { font-size: 14px; }
/* Faint big suit in the middle for a card-like look. */
.card .pip {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  opacity: 0.95;          /* solid colour so the suit reads at a glance */
}
.card.small .pip { font-size: 40px; }
.card.red { color: #c81e2c; }
.card.back {
  background: repeating-linear-gradient(45deg, #2a4d8f, #2a4d8f 7px, #1d376a 7px, #1d376a 14px);
  border: 2px solid #fff;
}
.card.placeholder { background: rgba(255,255,255,0.06); box-shadow: none; border: 1px dashed rgba(255,255,255,0.2); }

/* ---- Seats ---- */
#seats { position: absolute; inset: 0; }
.seat {
  position: absolute;
  width: 160px;
  transform: translate(-50%, -50%);
  text-align: center;
}
.seat .player-cards { display: flex; gap: 5px; justify-content: center; min-height: 95px; margin-bottom: 4px; }
/* Omaha: keep the 4 hole cards the SAME size as Hold'em, but fan them with a
   slight overlap so they still fit the seat width. Each card's top-left rank +
   suit stays visible (later cards paint on top), just like a real poker hand. */
.player-cards.four { gap: 0; }
.player-cards.four .card.small:not(:last-child) { margin-right: -40px; }
.nameplate {
  background: #122318;
  border: 1px solid #3c5c48;
  border-radius: 10px;
  padding: 6px 8px;
  font-size: 13px;
}
.nameplate .pname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nameplate .pchips { color: var(--gold); font-size: 17px; font-weight: 700; }
.seat.active .nameplate { border-color: var(--gold); box-shadow: 0 0 14px var(--gold); }
.seat.folded { opacity: 0.4; }
.seat.sitting .nameplate { border-style: dashed; opacity: 0.85; }
.sitting-badge { color: #9fbfa9; font-size: 11px; font-style: italic; }
.seat.disconnected .nameplate { border-color: #c98a2f; box-shadow: 0 0 10px rgba(201,138,47,0.5); }
.dc-badge { color: #ffb347; font-size: 11px; font-weight: 700; }
button.small.accent { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: 700; }
.seat.me .nameplate { background: #1c3a28; }
.seat .pbet {
  margin-top: 4px;
  font-size: 17px;
  font-weight: 700;
  color: #ffe9a8;
  min-height: 16px;
}
/* Highlight the live bet amount so it reads at a glance (chip-like pill). */
.seat .pbet:not(:empty) {
  display: inline-block;
  background: #2e2510;
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 1px 9px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.seat .paction { font-size: 11px; color: #9fbfa9; min-height: 14px; }
.pos-chip {
  display: inline-block;
  background: #3a5a98; color: #fff;
  font-size: 10px; font-weight: 800;
  padding: 1px 5px; border-radius: 4px;
  margin-right: 4px; vertical-align: middle;
}
.rp-pos {
  background: #3a5a98; color: #fff; font-size: 10px; font-weight: 800;
  padding: 1px 5px; border-radius: 4px;
}
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c8dcd0; cursor: pointer; }
.check-row input { width: auto; }
.dealer-btn {
  display: inline-block;
  width: 20px; height: 20px;
  background: #fff; color: #1a1a1a;
  border-radius: 50%;
  font-size: 11px; font-weight: 800;
  line-height: 20px;
  margin-left: 4px;
}
.winner-badge { color: #7CFC00; font-weight: 700; font-size: 12px; }

/* ---- Action bar ---- */
.action-bar, .waiting-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
}
.act {
  padding: 12px 22px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  color: #fff;
}
.act.fold { background: #a23b3b; }
.act.check { background: #3b6ea2; }
.act.call { background: #3b8a5a; }
.act.raise { background: #c9952f; color: #1a1a1a; }
.act:disabled { opacity: 0.35; cursor: not-allowed; }
.raise-group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.raise-controls { display: flex; align-items: center; gap: 8px; }
.bet-presets { display: flex; gap: 6px; justify-content: center; }
.bet-preset {
  padding: 6px 13px; border-radius: 6px; border: 1px solid #3c5c48;
  background: #1c3326; color: var(--gold); font-weight: 700; font-size: 14px; cursor: pointer;
}
.bet-preset:hover { background: #244232; }
.raise-input {
  width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #3c5c48;
  background: #122318; color: #fff; font-size: 15px;
}
#raise-slider { width: 160px; }

/* Live "my hand" readout above the action bar. */
.hand-rank {
  text-align: center; padding: 6px 12px;
  font-size: 16px; color: #ffe9a8;
}
.hand-rank b { color: #fff; font-weight: 800; }
.hand-rank .hr-tag {
  display: inline-block; width: 19px; height: 19px;
  background: var(--gold); color: #1a1a1a; border-radius: 50%;
  font-size: 11px; font-weight: 800; line-height: 19px; text-align: center;
  margin-right: 5px; vertical-align: middle;
}
.waiting-bar { flex-direction: column; gap: 6px; }
#deal-btn { width: 200px; }

/* ---- Pre-action bar (queue a move before your turn) ---- */
.preaction-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 8px 14px;
}
.preaction-bar .pre-label { color: #9fbfa9; font-size: 12px; margin-right: 2px; }
.pre-btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid #3c5c48; background: #122318; color: #cfe0d6;
  font-weight: 700; font-size: 13px; cursor: pointer;
}
.pre-btn:hover { background: #1c3326; }
.pre-btn.sel { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }

/* ---- Log ---- */
/* ---- Resizable docked panels (log + chat) ---- */
.panel {
  position: fixed;
  bottom: 8px;
  width: 280px;
  height: 150px;            /* adjustable by dragging the handle */
  display: flex;
  flex-direction: column;
  background: rgba(0,0,0,0.55);
  border-radius: 8px;
  overflow: hidden;
}
.log-panel { left: 8px; }
.chat-panel { right: 8px; height: 200px; }
.panel-handle {
  flex: none;
  height: 13px;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
}
.panel-handle:hover { background: rgba(255,255,255,0.14); }
.panel-handle .grip { width: 32px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.4); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 10px; }
.log-body { font-size: 11px; color: #b8ccc0; line-height: 1.5; }
.log-body div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-messages { font-size: 12px; line-height: 1.5; color: #e2efe8; }
.chat-messages .cname { color: var(--gold); font-weight: 700; }
.chat-messages div { word-break: break-word; }
.chat-form { display: flex; border-top: 1px solid #2c4a38; }
.chat-form input {
  flex: 1;
  padding: 8px 10px;
  border: none;
  background: #122318;
  color: #fff;
  font-size: 13px;
}
.chat-form input:focus { outline: none; }
.chat-form button {
  padding: 8px 12px;
  border: none;
  background: var(--gold);
  color: #1a1a1a;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
}

/* ---- Top bar extras ---- */
.topbar-spacer { flex: 1; }
#blinds-label { color: #9fbfa9; font-size: 13px; }
#mode-label:not(:empty) {
  color: #ffd98a; font-size: 12px; font-weight: 700;
  background: rgba(232, 196, 104, 0.12);
  border: 1px solid #5a4a22; border-radius: 6px; padding: 1px 7px;
}
#tourney-label {
  color: var(--gold); font-size: 13px; font-weight: 600;
  background: rgba(232, 196, 104, 0.12);
  border: 1px solid #5a4a22; border-radius: 6px; padding: 2px 8px;
}
.seat .nameplate { cursor: pointer; }

/* ---- Tournament level editor ---- */
.tourney-levels {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px 16px;
  margin-top: 12px;
  max-height: 240px;
  overflow-y: auto;
  padding-right: 4px;
}
.tl-row { display: flex; align-items: center; gap: 6px; }
.tl-row .tl-lab { color: #9fbfa9; font-size: 12px; width: 38px; flex: none; }
.tl-row input {
  width: 64px; padding: 5px 6px; border-radius: 5px;
  border: 1px solid #3c5c48; background: #0e1c14; color: #fff; font-size: 13px;
}
.tl-row input:disabled { opacity: 0.55; }
.tl-row .tl-sep { color: #6f8a7c; }

/* ---- Modals ---- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
.modal-box {
  background: #1c3326;
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 22px 26px;
  width: 460px;
  max-width: 92vw;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; }
.modal-head-actions { display: flex; align-items: center; gap: 10px; }
.mini-btn.ghost {
  background: transparent; color: var(--gold);
  border: 1px solid #5a4a22; font-weight: 700;
}
.mini-btn.ghost:hover { background: rgba(232, 196, 104, 0.12); filter: none; }
.modal-head h2 { margin: 0; color: var(--gold); font-size: 19px; }
.modal-close {
  background: transparent; border: none; color: #ccc;
  font-size: 18px; cursor: pointer;
}
.modal-note { font-size: 12px; color: #88a596; margin: 8px 0 0; line-height: 1.5; }
.db-status { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #122318; }
.db-status .ok { color: #7CFC00; font-weight: 700; }
.db-status .warn { color: #ffb347; font-weight: 700; }
.db-status .ver { color: #6f8a7c; font-size: 11px; }
.muted { color: #7c9a8a; font-size: 12px; font-weight: 400; }

.settings-section { margin-top: 18px; border-top: 1px solid #2c4a38; padding-top: 14px; }
.settings-section h3 { margin: 0 0 10px; font-size: 14px; color: #d8e8de; }
.field-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.field-row label { font-size: 13px; color: #c8dcd0; display: flex; align-items: center; gap: 6px; }
.field-row input {
  width: 90px; padding: 8px; border-radius: 6px;
  border: 1px solid #3c5c48; background: #122318; color: #fff; font-size: 14px;
}
.field-row select {
  padding: 8px; border-radius: 6px;
  border: 1px solid #3c5c48; background: #122318; color: #fff; font-size: 14px;
}
.mini-btn {
  padding: 8px 16px; border: none; border-radius: 6px;
  background: var(--gold); color: #1a1a1a; font-weight: 700; cursor: pointer; font-size: 13px;
}
.mini-btn:hover { filter: brightness(1.08); }

.adjust-list { display: flex; flex-direction: column; gap: 8px; }
.adjust-row {
  display: flex; align-items: center; gap: 8px;
  background: #122318; padding: 8px 10px; border-radius: 8px;
}
.adjust-row .arow-name { flex: 1; font-size: 13px; }
.adjust-row .arow-chips { color: var(--gold); font-size: 13px; min-width: 56px; text-align: right; }
.adjust-row input {
  width: 70px; padding: 6px; border-radius: 6px;
  border: 1px solid #3c5c48; background: #0e1c14; color: #fff; font-size: 13px;
}
.adjust-row button {
  padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 700; font-size: 13px;
}
.arow-add { background: #3b8a5a; color: #fff; }
.arow-remove { background: #a23b3b; color: #fff; }

.board-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
.board-table th, .board-table td { padding: 7px 8px; text-align: right; border-bottom: 1px solid #2c4a38; }
.board-table th:first-child, .board-table td:first-child { text-align: left; }
.board-table th { color: #9fbfa9; font-weight: 600; }
.board-table .net-pos { color: #7CFC00; font-weight: 700; }
.board-table .net-neg { color: #ff7a7a; font-weight: 700; }
.board-table .row-inactive { opacity: 0.5; }

/* Hide host-only controls for non-hosts. */
body.not-host .host-only { display: none !important; }

/* Spectator vs seated controls. */
body.spectating .seated-only { display: none !important; }
body:not(.spectating) .spectator-only { display: none !important; }
#spectator-label { color: #8fd0ff; font-size: 13px; font-weight: 600; }
#take-seat-btn { font-weight: 700; }

/* ---- Replay viewer ---- */
.modal-box.wide { width: 680px; }
.replay-layout { display: flex; gap: 14px; margin-top: 14px; }
.replay-list {
  width: 180px; flex: none; max-height: 60vh; overflow-y: auto;
  border-right: 1px solid #2c4a38; padding-right: 8px;
}
.replay-item {
  padding: 8px 10px; border-radius: 6px; font-size: 12px;
  cursor: pointer; color: #cfe0d6; margin-bottom: 4px;
}
.replay-item:hover { background: rgba(255,255,255,0.06); }
.replay-item.sel { background: #1c3a28; color: #fff; border: 1px solid var(--gold); }
.replay-view { flex: 1; min-width: 0; }
.replay-board { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 108px; }
.replay-pot { text-align: center; color: var(--gold); font-weight: 700; margin-top: 8px; }
.replay-players { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.rp-row { display: flex; align-items: center; gap: 10px; background: #122318; border-radius: 8px; padding: 6px 10px; }
.rp-row.folded { opacity: 0.45; }
.rp-cards { display: flex; gap: 3px; }
.rp-info { font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rp-name { font-weight: 700; }
.rp-stack { color: var(--gold); }
.rp-bet { color: #ffe9a8; }
.rp-act { color: #9fbfa9; }
.rp-hand { color: #8fd0ff; }
.rp-win { color: #7CFC00; font-weight: 700; }
.replay-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 10px; }
.replay-board { touch-action: none; cursor: ew-resize; }
.replay-scrub-row { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.replay-scrub { width: 100%; cursor: pointer; accent-color: var(--gold); }
.replay-scrub-hint { font-size: 11px; color: #6f8a7c; }

/* ===========================================================================
   Mobile / portrait layout (phones <= 600px wide). The desktop rules above are
   left untouched; everything here only applies on narrow screens.
   ======================================================================== */
@media (max-width: 600px) {
  .mobile-only { display: inline-block; }

  /* Stack the screen vertically: top bar / table (fills) / action bar at bottom. */

<body class="proposed">
  <aside class="preview-tools" aria-label="디자인 미리보기 설정">
    <div class="preview-title"><strong>디자인 미리보기</strong><span>예시 핸드 · 서버 연결 없음</span></div>
    <div class="preview-options">
      <div class="segmented" role="group" aria-label="디자인 선택">
        <button data-theme="original" aria-pressed="false">현재 스타일</button>
        <button data-theme="proposed" aria-pressed="true">개선안</button>
      </div>
      <div class="segmented" role="group" aria-label="미리보기 화면">
        <button data-screen="game" aria-pressed="true">게임</button>
        <button data-screen="join" aria-pressed="false">입장</button>
      </div>
    </div>
  </aside>

  <main id="game-screen">
    <header class="topbar">
      <div class="table-identity"><span class="brand-mark" aria-hidden="true">♠</span><span id="room-label">금요일 홀덤</span><span class="room-detail">친구들과 함께하는 테이블</span></div>
      <div class="table-meta"><span id="blinds-label">블라인드 50 / 100</span><span class="mode-label">노리밋 홀덤</span><span id="phase-label">플랍</span></div>
      <nav class="table-nav" aria-label="테이블 메뉴">
        <button class="small" data-dialog="자리비움">자리비움</button>
        <button class="small" data-dialog="리플레이">리플레이</button>
        <button class="small trainer-link" data-dialog="레인지 연습">♠ 레인지 연습</button>
        <button class="small" data-dialog="기록">기록</button>
        <button class="small" data-dialog="설정">설정</button>
        <button class="small" data-screen="join">나가기</button>
      </nav>
    </header>

    <section class="table-wrap" aria-label="6인 홀덤 테이블">
      <div class="table">
        <div class="felt-signature" aria-hidden="true">♠<span>Holdem</span></div>
        <div class="board">
          <div class="street-caption">플랍</div>
          <div id="community" class="community"></div>
          <div class="pot"><span class="pot-caption">전체 팟</span><span id="pot-value">1,500</span></div>
          <div class="status">내 차례</div>
          <div class="turn-timer">남은 시간 <strong>24초</strong></div>
          <div class="turn-bar"><div class="turn-bar-fill"></div></div>
        </div>
        <div id="seats"></div>
      </div>
    </section>

    <section class="action-dock" aria-label="내 액션">
      <div class="hand-rank"><span class="hand-caption">내 패</span><b>J 원페어</b><span class="hand-detail">콜 금액 300</span></div>
      <div class="action-bar">
        <div class="primary-actions"><button class="act fold" data-action="폴드">폴드</button><button class="act call" data-action="콜">콜 <strong>300</strong></button></div>
        <div class="raise-group">
          <div class="bet-presets"><button class="bet-preset" data-amount="600">½ 팟</button><button class="bet-preset" data-amount="900">¾ 팟</button><button class="bet-preset" data-amount="1500">팟</button><button class="bet-preset" data-amount="9800">올인</button></div>
          <div class="raise-controls"><input id="raise-slider" type="range" min="600" max="9800" step="100" value="900" aria-label="레이즈 금액"><input id="raise-amount" class="raise-input" type="number" min="600" max="9800" step="100" value="900" aria-label="레이즈 금액 직접 입력"><button class="act raise" data-action="레이즈">레이즈</button></div>
        </div>
      </div>
    </section>

    <section class="panel log-panel" aria-label="핸드 로그"><div class="panel-heading">핸드 로그 <span>#28</span></div><div class="panel-body log-body"><div>플랍 <b>J♠ 7♥ 2♣</b></div><div>도윤 체크</div><div>지우 베팅 <b>300</b></div><div class="log-current">내 차례 · 콜 300</div></div></section>
    <section class="panel chat-panel" aria-label="테이블 채팅"><div class="panel-heading">테이블 채팅 <span>6명</span></div><div id="chat-messages" class="panel-body chat-messages"><div><span class="cname">민준</span> 오늘은 오래 가보자</div><div><span class="cname">지우</span> 좋아 ㅋㅋ</div></div><form id="chat-form" class="chat-form"><input id="chat-input" maxlength="100" aria-label="채팅 메시지" placeholder="메시지 입력"><button type="submit">전송</button></form></section>
    <div class="mobile-panels"><button class="small" data-panel="log">핸드 로그</button><button class="small" data-panel="chat">채팅</button></div>
  </main>

  <main id="join-screen" class="overlay hidden">
    <form class="join-box" id="join-form">
      <div class="join-emblem" aria-hidden="true">♠</div>
      <h1>Holdem</h1>
      <p class="subtitle">친구들과 같은 테이블에서.</p>
      <label>닉네임<input id="name-input" maxlength="16" placeholder="테이블에서 사용할 이름" value="나" required></label>
      <label>방 이름<input id="room-input" value="금요일 홀덤" maxlength="24" required></label>
      <button id="join-btn" type="submit">테이블 입장</button>
      <button class="trainer-entry" type="button" data-dialog="레인지 연습">♠ 레인지 트레이너</button>
      <p class="hint">친구에게 방 이름을 알려주세요.<br>같은 이름으로 입장하면 함께 플레이할 수 있어요.</p>
    </form>
  </main>

  <dialog id="preview-dialog"><form method="dialog"><div class="dialog-head"><h2 id="dialog-title">미리보기</h2><button aria-label="닫기">✕</button></div><p id="dialog-copy"></p><button class="dialog-confirm">확인</button></form></dialog>
  <output id="feedback" aria-live="polite"></output>
  <script>// Offline design fixture. No WebSocket, fetch, persistent scores, or game commands.
const $ = (id) => document.getElementById(id);
let currentScreen = 'game';
const players = [
  { name: '나', chips: '9,800', pos: 'BTN', cards: ['As', 'Jd'], bet: '', me: true },
  { name: '민준', chips: '10,450', pos: 'SB', bet: '', folded: true },
  { name: '도윤', chips: '9,250', pos: 'BB', bet: '', action: '체크' },
  { name: '서연', chips: '10,100', pos: 'UTG', bet: '', folded: true },
  { name: '지우', chips: '8,900', pos: 'HJ', bet: '300', action: '베팅' },
  { name: '현우', chips: '9,500', pos: 'CO', bet: '', folded: true },
];
function card(code, small = false) {
  const el = document.createElement('div');
  el.className = 'card' + (small ? ' small' : '');
  if (code === 'back') { el.classList.add('back'); el.setAttribute('aria-label', '비공개 카드'); return el; }
  const suits = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const suit = suits[code.slice(-1)], rank = code.slice(0, -1);
  if (/[hd]$/.test(code)) el.classList.add('red');
  el.setAttribute('aria-label', rank + suit);
  el.innerHTML = `<span class="pip">${suit}</span><span class="corner-top"><span class="r">${rank}</span><span class="s">${suit}</span></span><span class="corner-bottom"><span class="r">${rank}</span><span class="s">${suit}</span></span>`;
  return el;
}
const row = document.createElement('div'); row.className = 'board-row';
['Js', '7h', '2c'].forEach(code => row.append(card(code)));
$('community').append(row);
function renderSeats() {
  $('seats').replaceChildren();
  const mobile = innerWidth <= 600;
  const proposal = document.body.classList.contains('proposed');
  players.forEach((p, i) => {
    const angle = i / players.length * 2 * Math.PI;
    const rx = mobile ? (proposal ? 43 : 44) : (proposal ? 48 : 52);
    const ry = mobile ? (proposal ? 43 : 44) : (proposal ? 44 : 47);
    const seat = document.createElement('div');
    seat.className = 'seat' + (p.me ? ' me active' : '') + (p.folded ? ' folded' : '');
    seat.style.left = `${50 - rx * Math.sin(angle)}%`;
    seat.style.top = `${50 + ry * Math.cos(angle)}%`;
    const cards = document.createElement('div'); cards.className = 'player-cards';
    (p.cards || ['back', 'back']).forEach(c => cards.append(card(c, true)));
    seat.append(cards);
    const nameplate = document.createElement('div'); nameplate.className = 'nameplate';
    nameplate.innerHTML = `<div class="pname"><span class="pos-chip">${p.pos}</span>${p.name}${p.me ? '<span class="dealer-btn">D</span>' : ''}</div><div class="pchips">${p.chips}</div>`;
    seat.append(nameplate);
    const bet = document.createElement('div'); bet.className = 'pbet'; bet.textContent = p.bet; seat.append(bet);
    const action = document.createElement('div'); action.className = 'paction'; action.textContent = p.folded ? '폴드' : (p.action || ''); seat.append(action);
    $('seats').append(seat);
  });
}
function screen(name) {
  currentScreen = name;
  $('game-screen').classList.toggle('hidden', name !== 'game');
  $('join-screen').classList.toggle('hidden', name !== 'join');
  document.querySelectorAll('.preview-tools [data-screen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.screen === name)));
  document.body.classList.remove('show-log', 'show-chat');
}
document.querySelectorAll('[data-theme]').forEach(button => button.addEventListener('click', () => {
  document.body.classList.toggle('proposed', button.dataset.theme === 'proposed');
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  renderSeats();
}));
document.querySelectorAll('[data-screen]').forEach(button => button.addEventListener('click', () => screen(button.dataset.screen)));
document.querySelectorAll('[data-amount]').forEach(button => button.addEventListener('click', () => {
  $('raise-amount').value = $('raise-slider').value = button.dataset.amount;
}));
$('raise-slider').addEventListener('input', () => { $('raise-amount').value = $('raise-slider').value; });
$('raise-amount').addEventListener('input', () => { $('raise-slider').value = $('raise-amount').value; });
let feedbackTimeout;
function feedback(text) {
  $('feedback').textContent = text; $('feedback').classList.add('visible');
  clearTimeout(feedbackTimeout); feedbackTimeout = setTimeout(() => $('feedback').classList.remove('visible'), 2800);
}
document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
  feedback(`${button.dataset.action}${button.dataset.action === '레이즈' ? ' ' + $('raise-amount').value : ''} 선택 · 디자인 미리보기입니다`);
}));
document.querySelectorAll('[data-dialog]').forEach(button => button.addEventListener('click', () => {
  $('dialog-title').textContent = button.dataset.dialog;
  $('dialog-copy').textContent = '이번 시안은 입장 화면과 게임 테이블을 비교하는 미리보기입니다. 이 메뉴는 실제 서비스에 연결하지 않았어요.';
  $('preview-dialog').showModal();
}));
document.querySelectorAll('[data-panel]').forEach(button => button.addEventListener('click', () => {
  const key = 'show-' + button.dataset.panel;
  const opened = document.body.classList.contains(key);
  document.body.classList.remove('show-log', 'show-chat');
  document.body.classList.toggle(key, !opened);
}));
$('join-form').addEventListener('submit', event => {
  event.preventDefault();
  $('room-label').textContent = $('room-input').value.trim() || '금요일 홀덤';
  players[0].name = $('name-input').value.trim() || '나'; renderSeats(); screen('game');
});
$('chat-form').addEventListener('submit', event => {
  event.preventDefault();
  const value = $('chat-input').value.trim(); if (!value) return;
  const line = document.createElement('div'); const name = document.createElement('span'); name.className = 'cname'; name.textContent = players[0].name;
  line.append(name, document.createTextNode(' ' + value)); $('chat-messages').append(line); $('chat-input').value = '';
  line.scrollIntoView({ block: 'nearest' });
});
window.addEventListener('resize', renderSeats);
renderSeats(); screen(currentScreen);
</script>
