# Supabase free projects pause after 7 days without activity.
# Once a day, call /keepalive: it wakes the Render server (cold start can take
# ~1 min) and runs a real query against the database.
name: keepalive

on:
  schedule:
    - cron: "17 19 * * *"   # 04:17 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database through the server
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 120 https://holdem-loong-kid.onrender.com/keepalive; then
              echo; exit 0
            fi
            echo "attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1
